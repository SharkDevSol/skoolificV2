name: iqra_parent
description: "IQRA Parent - guardian mobile app (Flutter rewrite)"
publish_to: 'none'
version: 4.2.0+6

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  skeletonizer: ^1.3.0
  url_launcher: ^6.2.5
  firebase_messaging: ^15.2.4
  firebase_core: ^3.13.0
  flutter_floating_bottom_bar: ^2.1.0
  loading_animation_widget: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
