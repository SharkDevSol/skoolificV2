# Codemagic CI for Skoolific V2 Apps
definitions:
  scripts:
    - name: Environment check
      script: |
        flutter --version
        xcodebuild -version
        pod --version

workflows:
  iqra-staff-ios:
    name: IQRA Staff iOS (App Store)
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.skoolific.iqraStaff
    integrations:
      app_store_connect: OneCo Solutions
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
    working_directory: flutter-staff-app
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Fetch dependencies
        script: flutter pub get
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA for App Store
        script: flutter build ipa --release --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  iqra-parent-ios:
    name: IQRA Parent iOS (unsigned)
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
    working_directory: flutter-parent-app
    scripts:
      - name: Fetch dependencies
        script: flutter pub get
      - name: Build unsigned iOS IPA
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
      - build/ios/iphoneos/Runner.app
