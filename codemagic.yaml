# Codemagic CI for IQRA Parent (monorepo: app lives in flutter-parent-app/)
# Phase 1: unsigned build -> downloadable .ipa artifact (no Apple account needed)
# Phase 2 (after Apple Developer enrollment): enable signing + App Store Connect
#   upload — see commented section at the bottom.

definitions:
  scripts:
    - name: Environment check
      script: |
        flutter --version
        xcodebuild -version
        pod --version

workflows:
  iqra-parent-ios:
    name: IQRA Parent iOS (unsigned)
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
    working_directory: flutter-parent-app
    scripts:
      - name: Fetch dependencies
        script: flutter pub get
      - name: Build unsigned iOS IPA
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
      - build/ios/iphoneos/Runner.app

# ---------------------------------------------------------------------------
# PHASE 2 — enable AFTER Apple Developer account exists:
# 1. App Store Connect -> Apps -> New App, bundle id: com.skoolific.guardian
# 2. App Store Connect -> Users and Access -> Integrations -> App Store Connect
#    API key (Issuer ID + .p8 key) -> Codemagic "apple_credentials" group
# 3. Replace the build script with:  flutter build ipa --release
#    (Codemagic signs with your distribution cert via automatic signing)
# 4. Add app_store_connect publishing -> builds land in TestFlight automatically.
# 5. Firebase Console -> add iOS app -> commit ios/Runner/GoogleService-Info.plist
#    (FCM push; build works without it, push notifications need it)
# ---------------------------------------------------------------------------
