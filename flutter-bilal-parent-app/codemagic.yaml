# Codemagic CI for IQRA Parent (Flutter iOS)
# Phase 1: unsigned build -> downloadable .ipa artifact (no Apple account needed)
# Phase 2 (after Apple Developer enrollment): enable signing + App Store Connect
#   upload — see commented section at the bottom.

definitions:
  scripts:
    - name: Environment check
      script: |
        flutter --version
        xcodebuild -version
        pod --version

workflows:
  iqra-parent-ios:
    name: IQRA Parent iOS (unsigned)
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
    scripts:
      - name: Fetch dependencies
        script: flutter pub get
      - name: Build unsigned iOS IPA
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
      - build/ios/iphoneos/Runner.app

# ---------------------------------------------------------------------------
# PHASE 2 — enable AFTER Apple Developer account exists:
# 1. App Store Connect -> Apps -> New App, bundle id: com.skoolific.guardian
# 2. App Store Connect -> Users and Access -> Integrations -> App Store Connect
#    API key (Issuer ID + .p8 key) -> put into Codemagic group "apple_credentials"
# 3. Replace the build script above with:
#      - flutter build ipa --release
#    and add signing (Team ID / bundle id) under environment:
#      xcode: latest
#      # then in workflow settings UI or:
#    mode: manual (App Store Connect publishing):
#    publishing:
#      app_store_connect:
#        api_key: $APP_STORE_CONNECT_KEY_IDENTIFIER (etc.)
# 4. Codemagic signs with your distribution cert + uploads the build
#    straight to TestFlight for review.
# ---------------------------------------------------------------------------
